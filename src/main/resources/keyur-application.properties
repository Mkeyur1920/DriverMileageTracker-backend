spring.application.name=DriverMileageTrackerBackend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver

# Optional: Set the Hibernate dialect explicitly
logging.level.org.springframework.security=DEBUG


# Optional: Configure JPA behavior
spring.datasource.hikari.auto-commit=false
spring.jpa.show-sql=true

# File upload properties
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#file.upload-dir=C:/Users/KEYUR/uploads/

jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
